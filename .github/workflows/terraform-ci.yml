# Terraform CI/CD pipeline with security scanning
# This workflow validates Terraform configuration and
# performs linting and security analysis.

name: Terraform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform CI Pipeline
    runs-on: ubuntu-latest

    steps:

      # Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Check Terraform formatting
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # Initialize Terraform without backend
      - name: Terraform Init
        run: terraform init -backend=false

      # Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Run Terraform linting
      - name: Run TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint Init
        run: tflint --init

      - name: TFLint Run
        run: tflint -f compact

      # Run Terraform security scan
      - name: Run tfsec security scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          additional_args: --minimum-severity HIGH